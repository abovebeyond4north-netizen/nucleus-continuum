name: Offline tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile continuum.py evalgate.py trialgate.py tests/test_continuum.py tests/test_evalgate.py tests/test_trialgate.py
      - name: Verify frozen evaluation fixture
        run: python evalgate.py suite
      - name: Unit tests
        run: python -m unittest discover -s tests -v
